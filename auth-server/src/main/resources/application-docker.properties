# Perfil docker (SPRING_PROFILES_ACTIVE=docker): HTTP dentro de la red Docker.
# Los secretos de los clientes NO tienen valor por defecto: deben llegar por variables de entorno.
spring.security.oauth2.authorizationserver.issuer=${AUTH_ISSUER:http://auth-server:9000}
spring.security.oauth2.authorizationserver.client.bbf-web.registration.client-secret={noop}${BBF_WEB_SECRET}
spring.security.oauth2.authorizationserver.client.bbf-mobile.registration.client-secret={noop}${BBF_MOBILE_SECRET}
spring.security.oauth2.authorizationserver.client.bbf-cajeros.registration.client-secret={noop}${BBF_CAJEROS_SECRET}
