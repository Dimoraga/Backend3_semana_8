spring.application.name=auth-server
server.port=9000

# Issuer: debe coincidir con la URL con la que los demas servicios llegan al auth-server
spring.security.oauth2.authorizationserver.issuer=${AUTH_ISSUER:http://localhost:9000}

# --- Cliente bbf-web ---
spring.security.oauth2.authorizationserver.client.bbf-web.registration.client-id=bbf-web
spring.security.oauth2.authorizationserver.client.bbf-web.registration.client-secret={noop}${BBF_WEB_SECRET:dev-web-secret}
spring.security.oauth2.authorizationserver.client.bbf-web.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.bbf-web.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.bbf-web.registration.scopes=core.read

# --- Cliente bbf-mobile ---
spring.security.oauth2.authorizationserver.client.bbf-mobile.registration.client-id=bbf-mobile
spring.security.oauth2.authorizationserver.client.bbf-mobile.registration.client-secret={noop}${BBF_MOBILE_SECRET:dev-mobile-secret}
spring.security.oauth2.authorizationserver.client.bbf-mobile.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.bbf-mobile.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.bbf-mobile.registration.scopes=core.read

# --- Cliente bbf-cajeros (lee y escribe: hace retiros) ---
spring.security.oauth2.authorizationserver.client.bbf-cajeros.registration.client-id=bbf-cajeros
spring.security.oauth2.authorizationserver.client.bbf-cajeros.registration.client-secret={noop}${BBF_CAJEROS_SECRET:dev-cajeros-secret}
spring.security.oauth2.authorizationserver.client.bbf-cajeros.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.bbf-cajeros.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.bbf-cajeros.registration.scopes=core.read,core.write