# Perfil docker (SPRING_PROFILES_ACTIVE=docker): MySQL en el servicio "mysql"; la clave solo por variable de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/springbatch_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
