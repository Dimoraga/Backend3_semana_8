# Perfil docker (SPRING_PROFILES_ACTIVE=docker): HTTP dentro de la red Docker, sin keystore TLS ni truststore.
server.port=8446
server.ssl.enabled=false

# core-banking-api por HTTP en la red Docker (CoreBankingClientConfig solo usa truststore con https://)
corebanking.client.base-url=${CORE_BASE_URL:http://core-banking-api:8443}

# Certificado publico con que core firma los JWT de usuario: volumen de solo lectura (./keys -> /keys)
corebanking.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:file:/keys/core-signing-cert.pem}

# OAuth2 client_credentials contra auth-server; el secreto solo por variable de entorno
spring.security.oauth2.client.registration.core.client-secret=${BBF_CAJEROS_SECRET}
spring.security.oauth2.client.provider.auth-server.token-uri=${AUTH_TOKEN_URI:http://auth-server:9000/oauth2/token}
