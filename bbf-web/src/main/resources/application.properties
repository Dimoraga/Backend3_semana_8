spring.application.name=bbf-web
spring.profiles.active=local

server.port=8444
server.ssl.enabled=true
server.ssl.key-store=classpath:keys/web-tls.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=web-tls

corebanking.client.base-url=${CORE_BASE_URL:https://localhost:8443}
corebanking.client.trust-store=classpath:keys/core-truststore.p12
corebanking.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:classpath:keys/core-signing-cert.pem}

logging.level.com.duoc.bbfweb=INFO

# OAuth2 Client: bbf-web obtiene tokens del auth-server (client_credentials)
spring.security.oauth2.client.registration.core.provider=auth-server
spring.security.oauth2.client.registration.core.client-id=bbf-web
spring.security.oauth2.client.registration.core.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.core.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.core.scope=core.read
spring.security.oauth2.client.provider.auth-server.token-uri=${AUTH_TOKEN_URI:http://localhost:9000/oauth2/token}