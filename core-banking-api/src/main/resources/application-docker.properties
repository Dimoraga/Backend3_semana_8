# Perfil docker (SPRING_PROFILES_ACTIVE=docker): HTTP dentro de la red Docker, sin keystore TLS.
# Contrasenas solo por variables de entorno (DB_PASSWORD, JWT_KEYSTORE_PASSWORD).
server.port=8443
server.ssl.enabled=false

spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/springbatch_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Llave de firma de JWT de usuario: se monta como volumen de solo lectura (./keys -> /keys), nunca va en la imagen
corebanking.jwt.keystore-path=${JWT_KEYSTORE_PATH:file:/keys/core-signing-key.p12}
corebanking.jwt.keystore-password=${JWT_KEYSTORE_PASSWORD}
corebanking.jwt.key-password=${JWT_KEY_PASSWORD:${JWT_KEYSTORE_PASSWORD}}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://auth-server:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_URI:http://auth-server:9000/oauth2/jwks}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:kafka:9092}
