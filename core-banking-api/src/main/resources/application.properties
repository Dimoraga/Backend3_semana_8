spring.application.name=core-banking-api

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

spring.profiles.active=local

server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keys/core-tls.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=core-tls

corebanking.jwt.keystore-path=${JWT_KEYSTORE_PATH:classpath:keys/core-signing-key.p12}
corebanking.jwt.key-alias=core-signing-key
corebanking.jwt.ttl-web-seconds=1800
corebanking.jwt.ttl-mobile-seconds=900
corebanking.jwt.ttl-mobile-refresh-seconds=604800
corebanking.jwt.ttl-cajero-seconds=300

logging.level.com.duoc.corebankingapi=INFO

# OAuth2 Resource Server: valida tokens emitidos por el auth-server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_URI:http://localhost:9000/oauth2/jwks}
# Kafka: publicacion de eventos de retiro (consumidos por notificaciones)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.properties.request.timeout.ms=3000
retiros.topic=retiros-realizados
